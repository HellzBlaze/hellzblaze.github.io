<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REat - Order Online</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="app-header">
        <h1>REat Ordering Portal</h1>
        <div class="restaurant-selector">
            <label for="restaurantSelect">Select Restaurant:</label>
            <select id="restaurantSelect">
                <option value="">-- Choose Store --</option>
            </select>
        </div>
    </header>

    <main class="container">
        <section id="menuSection" class="hidden">
            <nav class="categories-nav" id="categoryTabs"></nav>
            <div id="menuGrid" class="menu-grid"></div>
        </section>

        <section id="cartSection" class="cart-container hidden">
            <h2>Your Order</h2>
            <div id="cartItems"></div>
            <div class="order-details">
                <label>Order Type:
                    <select id="orderType">
                        <option value="dine-in">Dine-In</option>
                        <option value="takeaway">Takeaway</option>
                    </select>
                </label>
                <input type="text" id="customerName" placeholder="Your Name" required>
                <input type="text" id="tableNumber" placeholder="Table Number (Optional)">
                <div class="cart-total">Total: $<span id="cartTotal">0.00</span></div>
                <button id="submitOrderBtn" class="btn-primary">Place Order</button>
            </div>
        </section>

        <section id="trackerSection" class="tracker-container hidden">
            <h2>Live Order Tracker</h2>
            <div id="trackerStatus" class="status-badge">Pending</div>
            <p>Order ID: <span id="trackerOrderId"></span></p>
            <div id="trackerItems"></div>
        </section>
    </main>

    <script src="./assets/js/customer.js"></script>
</body>
</html>
